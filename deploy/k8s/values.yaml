# v911 Helm values
# 安装:helm install v911 ./deploy/k8s -f your-values.yaml
# 注:本 chart 手写模板,如本机无 helm,可用
#   docker run --rm -v $(pwd):/chart alpine/helm template v911 /chart
# 验证语法。

image:
  repository: ghcr.io/example/v911
  tag: ""            # 留空使用 .Chart.AppVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# ── server ──────────────────────────────────────────────────
server:
  replicaCount: 1
  # ⚠️ replicaCount > 1 时必须 db.driver=postgres,且共享 auth.jwtSecret
  resources: {}
  #  service:
  #    requests: { cpu: 100m, memory: 128Mi }
  #    limits:   { cpu: 500m, memory: 512Mi }

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: nginx
    host: v911.example.com
    tls:
      enabled: true
      secretName: v911-tls
    # WebSocket 已在模板中注入 nginx 必要注解(proxy-read-timeout 等)

  # 已存在的 Secret 名(包含 masterKey / adminPassword / jwtSecret);
  # 为空则使用下方 secret 子表自动生成
  existingSecret: ""

# ── 凭证(不填则由 chart 随机生成)────────────────────────────
secret:
  # kubeconfig 加密主密钥(32 字节 base64): openssl rand -base64 32
  masterKey: ""
  # 初始管理员密码(仅首启生效)
  adminPassword: ""
  # JWT 签名密钥
  jwtSecret: ""

# ── 数据库 ──────────────────────────────────────────────────
db:
  driver: sqlite            # sqlite | postgres
  dsn: ""                   # postgres 时必填完整 DSN
  sqlite:
    # 存储 SQLite 文件
    persistence:
      enabled: false
      existingClaim: ""
      size: 5Gi
      storageClass: ""

# ── ingress 需要的 WS 注解微调(一般无需修改)────────────────
ingressAnnotations: {}

# ── agent 子部署 ────────────────────────────────────────────
# 说明:Agent 部署在【被管集群】,不在 v911 所在集群;此开关仅用于
# "同集群自管" 演示场景。跨集群请用独立 agent 部署(见 templates/agent.yaml
# 单独渲染,或 helm template --set agent.enabled=true 后 apply 到被管集群)。
agent:
  enabled: false
  serverUrl: ""             # 必填,V911_SERVER_URL
  enrollToken: ""           # 必填,接入向导生成,V911_ENROLL_TOKEN
  replicaCount: 1
