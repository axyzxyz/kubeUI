{{/*
PVC:仅 sqlite 持久化开启且未指定 existingClaim 时渲染。
*/}}
{{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled (not .Values.db.sqlite.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeui.name" . }}-data
  labels:
    app.kubernetes.io/name: {{ include "kubeui.name" . }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.db.sqlite.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.db.sqlite.persistence.size }}
{{- end }}
