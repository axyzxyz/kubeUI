apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeui.name" . }}-server
  labels:
    app.kubernetes.io/name: {{ include "kubeui.name" . }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "kubeui.name" . }}
    app.kubernetes.io/component: server
