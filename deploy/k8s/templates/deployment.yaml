apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeui.name" . }}-server
  labels:
    app.kubernetes.io/name: {{ include "kubeui.name" . }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeui.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeui.name" . }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/kubeui/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KUBEUI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret | default (printf "%s-secret" (include "kubeui.name" .)) }}
                  key: masterKey
            - name: KUBEUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret | default (printf "%s-secret" (include "kubeui.name" .)) }}
                  key: adminPassword
            - name: KUBEUI_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret | default (printf "%s-secret" (include "kubeui.name" .)) }}
                  key: jwtSecret
            - name: KUBEUI_DB_DRIVER
              value: {{ .Values.db.driver | quote }}
            {{- if eq .Values.db.driver "postgres" }}
            - name: KUBEUI_DB_DSN
              value: {{ .Values.db.dsn | quote }}
            {{- else }}
            - name: KUBEUI_DB_DSN
              value: /data/kubeui.db
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            {{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        {{- if and (eq .Values.db.driver "sqlite") .Values.db.sqlite.persistence.enabled }}
        - name: data
          {{- if .Values.db.sqlite.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.db.sqlite.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "kubeui.name" . }}-data
          {{- end }}
        {{- end }}
