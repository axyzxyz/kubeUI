{{- if not .Values.server.existingSecret }}
{{/*
自动生成 masterKey / adminPassword / jwtSecret。
注意:helm install 升级时会重渲染;务必安装后保存,或用 --set / existingSecret 固定。
masterKey 一经使用不可更换(kubeconfig 加密解绑)。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeui.name" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "kubeui.name" . }}
type: Opaque
stringData:
  masterKey: {{ .Values.secret.masterKey | default (randAlphaNum 44) | quote }}
  adminPassword: {{ .Values.secret.adminPassword | default "admin123" | quote }}
  jwtSecret: {{ .Values.secret.jwtSecret | default (randAlphaNum 64) | quote }}
{{- end }}
