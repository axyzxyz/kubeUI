version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - misspell
    - noctx
    - revive
    - sloglint
    - staticcheck
    - unconvert
    - unused
    # contextcheck / goconst / unparam 暂停用:
    # - contextcheck: 后台 worker(informer/健康循环)合法使用 context.Background
    # - goconst: handler 中 "items"/"code" 等 JSON 键重复属正常形态
    # - unparam: 测试辅助函数的固定参数是常见形态
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
    goconst:
      min-occurrences: 4
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: context-as-argument
    sloglint:
      no-mixed-args: true
      key-naming-case: camel
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
