# Release 流水线:打 tag(v*)触发
#   - 交叉编译 linux/amd64 与 windows/amd64 的 kubeui-server / kubeui-agent(内嵌前端)
#   - linux 打 tar.gz,windows 打 zip
#   - 构建 GitHub Release 并上传压缩包
#   - 构建并推送镜像到 ghcr.io/axyzxyz/kubeui(server,含 agent 入口)
#     与 ghcr.io/axyzxyz/kubeui-agent(纯 agent target)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '', arc: tar.gz }
          - { goos: windows, goarch: amd64, ext: .exe, arc: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Embed frontend dist
        run: |
          rm -rf backend/internal/web/dist
          mkdir -p backend/internal/web/dist
          cp -r frontend/dist/. backend/internal/web/dist/
      - name: Build binaries
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w"
          mkdir -p out
          CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" \
            -o out/kubeui-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/server
          CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" \
            -o out/kubeui-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/agent
      # server 与 agent 分包发布,各自独立下载升级
      - name: Package archives
        working-directory: backend/out
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OS="${{ matrix.goos }}"; ARCH="${{ matrix.goarch }}"; EXT="${{ matrix.ext }}"
          SRV="kubeui-server-$OS-$ARCH$EXT"
          AGT="kubeui-agent-$OS-$ARCH$EXT"
          if [ "${{ matrix.arc }}" = "zip" ]; then
            zip "kubeui-server-$VER-$OS-$ARCH.zip" "$SRV"
            zip "kubeui-agent-$VER-$OS-$ARCH.zip" "$AGT"
          else
            tar czf "kubeui-server-$VER-$OS-$ARCH.tar.gz" "$SRV"
            tar czf "kubeui-agent-$VER-$OS-$ARCH.tar.gz" "$AGT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kubeui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            backend/out/*.tar.gz
            backend/out/*.zip

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: kubeui-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    env:
      # 不上传 buildx 构建记录 artifact(污染 release 下载,曾致 download-artifact 失败)
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeui:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kubeui:latest
      - name: Push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeui-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kubeui-agent:latest
